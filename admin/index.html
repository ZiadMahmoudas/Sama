<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>لوحة تحكم سِمة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>


    <main id="loginView" class="login-view">
      <section class="login-card">
        <a href="../index.html" class="brand brand-centered" aria-label="العودة للموقع">
          <img src="../images/Logo1.svg" alt="SIMA" />
        </a>
        <span class="eyebrow">لوحة الإدارة</span>
        <h1>أهلاً بك من جديد</h1>
        <p>سجّل الدخول بحساب الأدمن الموجود داخل Supabase Auth.</p>
        <form id="loginForm" class="login-form">
          <label>
            <span>البريد الإلكتروني</span>
            <input id="loginEmail" name="email" type="email" autocomplete="username" required placeholder="admin@example.com" />
          </label>
          <label>
            <span>كلمة المرور</span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
          </label>
          <button id="loginButton" class="primary-button" type="submit">دخول لوحة التحكم</button>
          <p id="loginError" class="form-error" role="alert"></p>
        </form>
      </section>
    </main>

    <div id="dashboardView" class="dashboard" hidden>
      <aside class="sidebar">
        <a href="../index.html" class="brand">
          <img src="../images/Logo1.svg" alt="SIMA" />
        </a>
        <nav id="mainNav" class="main-nav" aria-label="أقسام لوحة التحكم">
          <button class="nav-item active" data-section="overview"><span>⌂</span>نظرة عامة</button>
          <button class="nav-item" data-section="messages"><span>✉</span>الرسائل <b id="messagesBadge" class="badge" hidden>0</b></button>
          <button class="nav-item" data-section="services"><span>✦</span>الخدمات</button>
          <button class="nav-item" data-section="pricing"><span>◈</span>الباقات</button>
          <button class="nav-item" data-section="portfolio"><span>▦</span>الأعمال</button>
          <button class="nav-item" data-section="faq"><span>?</span>الأسئلة</button>
          <button class="nav-item" data-section="process_steps"><span>↗</span>خطوات العمل</button>
          <button class="nav-item" data-section="testimonials"><span>★</span>آراء العملاء</button>
          <button class="nav-item" data-section="site_logos"><span>◉</span>الشعارات</button>
          <button class="nav-item" data-section="settings"><span>⚙</span>إعدادات الموقع</button>
        </nav>
        <button id="logoutButton" class="logout-button" type="button">تسجيل الخروج</button>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div>
            <span class="eyebrow">SIMA CMS</span>
            <h1 id="pageTitle">نظرة عامة</h1>
          </div>
          <div class="topbar-actions">
            <a class="ghost-button" href="../index.html" target="_blank" rel="noopener">فتح الموقع ↗</a>
            <span id="currentUser" class="user-chip"></span>
          </div>
        </header>

        <section id="contentArea" class="content-area" aria-live="polite"></section>
      </div>
    </div>

    <div id="modal" class="modal-backdrop" hidden>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
          <div>
            <span class="eyebrow">تعديل المحتوى</span>
            <h2 id="modalTitle">إضافة عنصر</h2>
          </div>
          <button id="modalClose" class="icon-button" type="button" aria-label="إغلاق">×</button>
        </div>
        <form id="editorForm" class="editor-form"></form>
      </section>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script src="../supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
  </body>
</html>
